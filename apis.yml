name: Hooked
description: 'Hooked is a mobile entertainment company founded in 2015 by Prerna Gupta
  and Parag Chordia (Telepathic, Inc.) that pioneered the chat-fiction format: bite-sized,
  suspenseful stories read as simulated text-message conversations. Its flagship Hooked
  app reached #1 on the App Store and Google Play in more than 25 countries and over
  100 million viewers, and the company later launched Hooked TV, a short-form mobile
  video streaming service. Hooked uses data and AI to predict and produce hit short-form
  content distributed across its own apps and social platforms including TikTok, Instagram,
  Snapchat, and YouTube. It is backed by 500 Global, Cowboy Ventures, Sound Ventures,
  The Chernin Group, Founders Fund, and Greylock. Hooked does not currently publish
  a public API, developer portal, or SDK.'
